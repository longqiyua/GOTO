<!-- 赞助与联系页面 — community_page.html（文档片段，嵌入 docPreview） -->
<style>
.community-page-wrap{
  font-family:var(--font-cn,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif);
  color:var(--ink,#202126);
  padding:8px 4px 24px;
}
.community-page-head{
  margin-bottom:24px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line,rgba(32,33,38,0.08));
}
.community-page-head h1{
  font-size:22px;
  font-weight:700;
  letter-spacing:-0.02em;
  margin-bottom:4px;
}
.community-page-head p{
  font-size:12px;
  color:var(--muted,#8e8f96);
}
.community-cards-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
}
@media(max-width:680px){
  .community-cards-grid{grid-template-columns:1fr;}
}
.comm-card{
  background:var(--card-bg,#fff);
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--line,rgba(32,33,38,0.08));
  display:flex;
  flex-direction:column;
}
.comm-card-head{
  padding:16px 18px 12px;
  border-bottom:1px solid var(--line,rgba(32,33,38,0.08));
}
.comm-card-num{
  font-size:9px;
  font-weight:600;
  letter-spacing:0.14em;
  color:var(--accent,#C45A26);
  text-transform:uppercase;
  margin-bottom:4px;
  display:block;
}
.comm-card-head h2{
  font-size:16px;
  font-weight:700;
  letter-spacing:-0.01em;
}
.comm-card-body{
  padding:14px 18px 16px;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.comm-section-label{
  font-size:10px;
  font-weight:600;
  color:var(--muted,#8e8f96);
  letter-spacing:0.08em;
  text-transform:uppercase;
  margin-bottom:6px;
}
.comm-qr-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.comm-qr-item{text-align:center;}
.comm-qr-frame{
  width:100%;
  aspect-ratio:1;
  border-radius:8px;
  overflow:hidden;
  border:1px solid var(--line,rgba(32,33,38,0.08));
  background:#fafafa;
  margin-bottom:4px;
}
.comm-qr-frame img{width:100%;height:100%;object-fit:cover;}
.comm-qr-caption{font-size:10px;color:var(--ink-soft,#5a5b62);}
.comm-kofi-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px;
  border-radius:8px;
  border:1px solid var(--line,rgba(32,33,38,0.08));
  text-decoration:none;
  color:var(--ink,#202126);
  font-size:12px;
  font-weight:600;
  transition:border-color 0.25s,background 0.25s;
}
.comm-kofi-link:hover{
  border-color:var(--accent,#C45A26);
  background:rgba(198,93,33,0.08);
}
.comm-kofi-link i{color:var(--accent,#C45A26);font-style:normal;}
.comm-locked-wrap{position:relative;border-radius:8px;overflow:hidden;}
.comm-locked-overlay{
  position:absolute;inset:0;
  background:rgba(248,247,244,0.82);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  z-index:2;
}
.comm-locked-text{
  font-size:11px;
  font-weight:600;
  color:var(--muted,#8e8f96);
  letter-spacing:0.1em;
  padding:5px 12px;
  border:1px solid var(--line,rgba(32,33,38,0.08));
  border-radius:18px;
  background:rgba(255,255,255,0.7);
}
.comm-badge-btn{
  width:100%;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid color-mix(in srgb,var(--accent,#C45A26) 28%,transparent);
  background:linear-gradient(135deg,
    color-mix(in srgb,var(--accent,#C45A26) 8%,transparent) 0%,
    color-mix(in srgb,var(--accent,#C45A26) 3%,transparent) 100%);
  color:var(--accent,#C45A26);
  font-size:12px;
  font-weight:700;
  letter-spacing:0.04em;
  cursor:pointer;
  font-family:'Poppins','Helvetica Neue',Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all 0.28s var(--ease-smooth,cubic-bezier(0.4,0,0.2,1));
  position:relative;
  overflow:hidden;
}
.comm-badge-btn::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 20% 0%,
    color-mix(in srgb,var(--accent,#C45A26) 22%,transparent) 0%,
    transparent 60%);
  opacity:0.7;pointer-events:none;
  transition:opacity 0.28s var(--ease-smooth,cubic-bezier(0.4,0,0.2,1));
}
.comm-badge-btn:hover{
  border-color:color-mix(in srgb,var(--accent,#C45A26) 48%,transparent);
  background:linear-gradient(135deg,
    color-mix(in srgb,var(--accent,#C45A26) 14%,transparent) 0%,
    color-mix(in srgb,var(--accent,#C45A26) 6%,transparent) 100%);
  transform:translateY(-1px);
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent,#C45A26) 22%,transparent);
}
.comm-badge-btn:hover::before{opacity:1;}
.comm-badge-btn .cb-logo{
  font-weight:700;font-size:13px;letter-spacing:-0.3px;
  position:relative;z-index:1;
}
.comm-badge-btn .cb-text{
  font-weight:600;font-size:12px;letter-spacing:0.02em;
  position:relative;z-index:1;
}
.comm-badge-btn .cb-arrow{
  font-size:14px;font-weight:300;
  margin-left:auto;
  transition:transform 0.28s var(--ease-smooth,cubic-bezier(0.4,0,0.2,1));
  position:relative;z-index:1;
}
.comm-badge-btn:hover .cb-arrow{transform:translateX(3px);}
.comm-purpose{
  font-size:9.5px;
  color:var(--muted,#8e8f96);
  line-height:1.5;
  text-align:center;
  margin-top:auto;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:0.005em;
  opacity:0.92;
}
.comm-purpose .cp-emoji{
  font-size:10px;
  margin-right:3px;
  vertical-align:baseline;
  -webkit-text-fill-color:initial;
}
.comm-intro{
  font-size:11px;
  color:var(--ink-soft,#5a5b62);
  line-height:1.6;
}
.comm-field{display:flex;flex-direction:column;gap:4px;}
.comm-field-label{
  font-size:10px;
  font-weight:600;
  color:var(--ink-soft,#5a5b62);
}
.comm-field-input{
  width:100%;
  padding:7px 10px;
  border:1px solid var(--line,rgba(32,33,38,0.08));
  border-radius:7px;
  font-size:12px;
  font-family:inherit;
  color:var(--ink,#202126);
  background:#fafafa;
  transition:border-color 0.25s;
}
.comm-field-input:focus{
  outline:none;
  border-color:var(--accent,#C45A26);
  background:#fff;
}
.comm-id-actions{display:flex;gap:7px;}
.comm-id-actions button{
  flex:1;
  padding:7px;
  border-radius:7px;
  border:1px solid var(--line,rgba(32,33,38,0.08));
  background:transparent;
  color:var(--ink-soft,#5a5b62);
  font-size:10px;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
  transition:all 0.25s;
}
.comm-id-actions button:hover{
  border-color:var(--accent,#C45A26);
  color:var(--accent,#C45A26);
}
.comm-id-actions button#fillCommentPage{
  border-color:color-mix(in srgb,var(--accent,#C45A26) 30%,transparent);
  background:color-mix(in srgb,var(--accent,#C45A26) 8%,transparent);
  color:var(--accent,#C45A26);
}
.comm-id-actions button#fillCommentPage:hover{
  background:color-mix(in srgb,var(--accent,#C45A26) 14%,transparent);
}
.comm-privacy{
  font-size:9px;
  color:var(--muted,#8e8f96);
  line-height:1.5;
}
.comm-giscus-host{
  margin-top:4px;
  border-top:1px solid var(--line,rgba(32,33,38,0.08));
  padding-top:12px;
}
.comm-giscus-note{
  font-size:10px;
  color:var(--muted,#8e8f96);
  text-align:center;
  padding:12px;
}
</style>

<div class="community-page-wrap">
  <div class="community-page-head">
    <h1 data-i18n="communityPageTitle">赞助与联系</h1>
    <p data-i18n="communityPageSub">支持 GOTO 的持续开发，或留下你的想法</p>
  </div>

  <div class="community-cards-grid">

    <!-- Sponsor 卡片 -->
    <div class="comm-card sponsor-card">
      <div class="comm-card-head">
        <span class="comm-card-num">01 / SUPPORT</span>
        <h2 data-i18n="sponsorTitle">Sponsor</h2>
      </div>
      <div class="comm-card-body">
        <div class="comm-locked-wrap">
          <div class="comm-section-label" data-i18n="paymentLabel">收款码</div>
          <div class="comm-qr-grid">
            <div class="comm-qr-item">
              <div class="comm-qr-frame"><img src="../payment-qr/wechat.jpg" alt="微信收款码" loading="lazy"></div>
              <div class="comm-qr-caption" data-i18n="wechatPay">微信支付</div>
            </div>
            <div class="comm-qr-item">
              <div class="comm-qr-frame"><img src="../payment-qr/alipay.jpg" alt="支付宝收款码" loading="lazy"></div>
              <div class="comm-qr-caption" data-i18n="alipay">支付宝</div>
            </div>
          </div>
          <div class="comm-section-label" style="margin-top:12px;" data-i18n="kofiLabel">Ko-fi</div>
          <a class="comm-kofi-link" href="https://ko-fi.com/longqiyua" target="_blank" rel="noopener noreferrer">
            <span>Ko-fi</span>
            <b data-i18n="buyMeCoffee">Buy me a coffee</b>
            <i>↗</i>
          </a>
          <div class="comm-locked-overlay">
            <span class="comm-locked-text" data-i18n="comingSoon">暂未开放</span>
          </div>
        </div>
        <button class="comm-badge-btn" id="downloadGotoBadgePage" aria-label="GOTO Badge">
          <span class="cb-logo">GOTO</span>
          <span class="cb-text" data-i18n="gotoBadge">徽章</span>
          <span class="cb-arrow" aria-hidden="true">›</span>
        </button>
        <p class="comm-purpose" data-i18n="sponsorPurpose">赞助仅用于支持个人开发者持续维护和改进 GOTO 项目</p>
      </div>
    </div>

    <!-- Say Hello 卡片 -->
    <div class="comm-card hello-card">
      <div class="comm-card-head">
        <span class="comm-card-num">02 / COMMUNITY</span>
        <h2 data-i18n="helloTitle">Say Hello</h2>
      </div>
      <div class="comm-card-body">
        <p class="comm-intro" data-i18n="helloIntro">留言由 giscus 保存到 GitHub Discussions；登录 GitHub 后即可发布与回复。</p>
        <div class="comm-field">
          <div class="comm-field-label" data-i18n="nameLabel">我们如何称呼您？</div>
          <input class="comm-field-input" id="helloNameInputPage" type="text" maxlength="60" autocomplete="name" placeholder="称呼">
        </div>
        <div class="comm-field">
          <div class="comm-field-label" data-i18n="contactLabel">我们如何联系您？（可选填写）</div>
          <input class="comm-field-input" id="helloContactInputPage" type="text" maxlength="120" autocomplete="email" placeholder="联系方式">
        </div>
        <div class="comm-id-actions">
          <button id="saveHelloIdentityPage" data-i18n="saveLocal">保存到本机</button>
          <button id="copyHelloIdentityPage" data-i18n="copyCard">复制联系卡</button>
          <button id="fillCommentPage" data-i18n="fillComment">填入评论</button>
        </div>
        <p class="comm-privacy" data-i18n="privacyNote">称呼与联系方式默认只保存在当前设备；仅当你主动粘贴进留言时才会公开。</p>
        <div class="comm-giscus-host" id="giscusHostPage">
          <div class="comm-giscus-note" data-i18n="giscusNote">评论区加载中…（需登录 GitHub）</div>
        </div>
      </div>
    </div>

  </div>
</div>

<style>
/* ════ 英文模式排版优化 ════ */
body.lang-en .community-page-wrap,
html.lang-en .community-page-wrap{
  font-family:var(--font-en,-apple-system,'Inter','Segoe UI',sans-serif);
  letter-spacing:-0.005em;
}
body.lang-en .community-page-head h1,
html.lang-en .community-page-head h1{
  letter-spacing:-0.025em;
  font-weight:700;
}
body.lang-en .comm-card-num,
html.lang-en .comm-card-num{
  letter-spacing:0.12em;
  font-weight:700;
}
body.lang-en .comm-purpose,
html.lang-en .comm-purpose{
  font-style:italic;
  line-height:1.5;
}
body.lang-en .comm-field-label,
html.lang-en .comm-field-label{
  letter-spacing:0.01em;
}
body.lang-en .comm-privacy,
html.lang-en .comm-privacy{
  line-height:1.55;
}
</style>

<script>
(function(){
  var KEY='goto_hello_identity';
  function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(_){return{};}}
  function write(v){try{localStorage.setItem(KEY,JSON.stringify(v));}catch(_){}}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  var nameInput=document.getElementById('helloNameInputPage');
  var contactInput=document.getElementById('helloContactInputPage');
  var saveBtn=document.getElementById('saveHelloIdentityPage');
  var copyBtn=document.getElementById('copyHelloIdentityPage');

  var saved=read();
  if(saved.name)nameInput.value=saved.name;
  if(saved.contact)contactInput.value=saved.contact;

  if(saveBtn)saveBtn.addEventListener('click',function(){
    write({name:nameInput.value||'',contact:contactInput.value||''});
    var orig=saveBtn.textContent;
    saveBtn.textContent='✓';
    setTimeout(function(){saveBtn.textContent=orig;},1200);
  });

  if(copyBtn)copyBtn.addEventListener('click',function(){
    var name=nameInput.value||'匿名';
    var contact=contactInput.value||'';
    var card='GOTO 联系卡\n称呼：'+esc(name)+(contact?('\n联系方式：'+esc(contact)):'');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(card).then(function(){
        var orig=copyBtn.textContent;copyBtn.textContent='✓';setTimeout(function(){copyBtn.textContent=orig;},1200);
      });
    }else{
      var ta=document.createElement('textarea');ta.value=card;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');var orig=copyBtn.textContent;copyBtn.textContent='✓';setTimeout(function(){copyBtn.textContent=orig;},1200);}catch(_){}
      document.body.removeChild(ta);
    }
  });

  // 填入评论：将联系卡内容复制到剪贴板并滚动到评论区，提示用户粘贴
  var fillBtn=document.getElementById('fillCommentPage');
  if(fillBtn)fillBtn.addEventListener('click',function(){
    var name=nameInput.value||'';
    var contact=contactInput.value||'';
    var isEn=window._lang==='en'||(window.parent&&window.parent._lang==='en');
    // 检查是否有称呼
    if(!name){
      var hint=nameInput;
      hint.style.borderColor='var(--accent,#C45A26)';
      hint.focus();
      setTimeout(function(){hint.style.borderColor='';},1500);
      return;
    }
    // 组合评论文本
    var text=(isEn?'Hello, I am ':'你好，我是 ')+name;
    if(contact)text+=(isEn?'\nContact: ':'\n联系方式：')+contact;
    text+='\n— via GOTO';
    // 复制到剪贴板
    var copied=false;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){copied=true;});
    }else{
      var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');copied=true;}catch(_){}
      document.body.removeChild(ta);
    }
    // 滚动到评论区
    var host=document.getElementById('giscusHostPage');
    if(host)host.scrollIntoView({behavior:'smooth',block:'center'});
    // 显示浮动提示
    var tip=document.createElement('div');
    tip.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(20,20,22,0.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:600;z-index:10000;backdrop-filter:blur(12px);box-shadow:0 6px 20px rgba(0,0,0,0.3);transition:opacity 0.4s;max-width:90vw;text-align:center;line-height:1.5;';
    tip.innerHTML=copied
      ?(isEn?'✓ Copied! Paste in comment box (Ctrl+V)':'✓ 已复制！请在评论框中粘贴 (Ctrl+V)')
      :(isEn?'Please paste in comment box (Ctrl+V)':'请在评论框中粘贴 (Ctrl+V)');
    document.body.appendChild(tip);
    // 按钮反馈
    var orig=fillBtn.textContent;
    fillBtn.textContent='✓';
    fillBtn.style.color='var(--accent,#C45A26)';
    fillBtn.style.borderColor='var(--accent,#C45A26)';
    setTimeout(function(){
      fillBtn.textContent=orig;
      fillBtn.style.color='';
      fillBtn.style.borderColor='';
    },2000);
    // 3秒后淡出提示
    setTimeout(function(){tip.style.opacity='0';setTimeout(function(){if(tip.parentNode)tip.parentNode.removeChild(tip);},400);},3000);
  });

  var badgeBtn=document.getElementById('downloadGotoBadgePage');
  if(badgeBtn)badgeBtn.addEventListener('click',function(){
    _openGotoBadgeOverlay();
  });

  // ═══ GOTO 徽章全屏展示（含泛光光晕 + PNG/HTML 下载） ═══
  // 设计意图：精致克制的徽章视觉，强调色泛光，无浮夸装饰
  function _openGotoBadgeOverlay(){
    // 移除已有遮罩
    var exist=document.getElementById('gotoBadgeOverlay');
    if(exist) exist.remove();

    var isEn=window._lang==='en'||(window.parent&&window.parent._lang==='en')||document.body.classList.contains('lang-en');
    var accent='#FF5A00';

    // GOTO Archive Badge：黑 / 暖白 / GOTO 橙三色，不继承用户强调色，
    // 避免黄色或彩虹色破坏品牌一致性。PNG 与 HTML 下载格式保持不变。
    var badgeSVG = [
      '<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">',
        '<defs>',
          '<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">',
            '<path d="M24 0H0V24" fill="none" stroke="#F3EFE6" stroke-opacity=".055" stroke-width="1"/>',
          '</pattern>',
          '<pattern id="micro" width="5" height="5" patternUnits="userSpaceOnUse">',
            '<circle cx="1" cy="1" r=".45" fill="#F3EFE6" fill-opacity=".12"/>',
          '</pattern>',
          '<clipPath id="badgeClip"><rect x="24" y="24" width="432" height="432" rx="26"/></clipPath>',
        '</defs>',
        '<rect width="480" height="480" fill="#0F100E"/>',
        '<g clip-path="url(#badgeClip)">',
          '<rect x="24" y="24" width="432" height="432" fill="#11110F"/>',
          '<rect x="24" y="24" width="432" height="432" fill="url(#grid)"/>',
          '<rect x="24" y="24" width="432" height="432" fill="url(#micro)" opacity=".55"/>',
          '<path d="M24 24H456V162L286 456H24Z" fill="#F3EFE6"/>',
          '<g fill="none" stroke="#11110F" stroke-opacity=".13" stroke-width="1">',
            '<ellipse cx="126" cy="331" rx="104" ry="54"/>',
            '<ellipse cx="126" cy="331" rx="82" ry="42"/>',
            '<ellipse cx="126" cy="331" rx="60" ry="30"/>',
            '<ellipse cx="126" cy="331" rx="38" ry="18"/>',
          '</g>',
          '<path d="M70 336L190 278L285 346L382 205" fill="none" stroke="'+accent+'" stroke-width="2"/>',
          '<g fill="#F3EFE6" stroke="'+accent+'" stroke-width="3">',
            '<circle cx="70" cy="336" r="6"/><circle cx="190" cy="278" r="6"/><circle cx="285" cy="346" r="6"/><circle cx="382" cy="205" r="6"/>',
          '</g>',
          '<path d="M334 24H456V146Z" fill="'+accent+'"/>',
          '<path d="M456 334V456H334Z" fill="#090A09"/>',
        '</g>',
        '<rect x="24.5" y="24.5" width="431" height="431" rx="25.5" fill="none" stroke="#F3EFE6" stroke-opacity=".30"/>',
        '<text x="58" y="80" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="'+accent+'" letter-spacing="2.8">LOCAL SEARCH LAUNCHER</text>',
        '<text x="58" y="178" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="300" fill="#11110F" letter-spacing="-7">go to</text>',
        '<text x="58" y="246" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="800" fill="'+accent+'" letter-spacing="-5">GOTO</text>',
        '<text x="58" y="376" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#11110F" letter-spacing="1.5">ONE STEP · LOCAL INTELLIGENCE</text>',
        '<text x="58" y="406" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700" fill="#11110F" fill-opacity=".52" letter-spacing="1.8">ENGINE / BASE / WHERE</text>',
        '<text x="422" y="424" transform="rotate(-90 422 424)" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700" fill="#F3EFE6" fill-opacity=".72" letter-spacing="2.2">LOSON PRESENTS · V1.0</text>',
      '</svg>'
    ].join('');

  // 下载 PNG：将 SVG 绘制到 canvas 后导出
  function _downloadBadgePNG(svgStr){
    try{
      var blob=new Blob([svgStr],{type:'image/svg+xml;charset=utf-8'});
      var url=URL.createObjectURL(blob);
      var img=new Image();
      img.onload=function(){
        try{
          var canvas=document.createElement('canvas');
          canvas.width=1680;canvas.height=1060;
          var ctx=canvas.getContext('2d');
          ctx.fillStyle='#0a0a0c';
          ctx.fillRect(0,0,1680,1060);
          ctx.drawImage(img,0,0,1680,1060);
          canvas.toBlob(function(b){
            if(!b){ alert('PNG 导出失败'); return; }
            var u=URL.createObjectURL(b);
            var a=document.createElement('a');a.href=u;a.download='goto-badge.png';a.click();
            setTimeout(function(){URL.revokeObjectURL(u);},1000);
          },'image/png');
          URL.revokeObjectURL(url);
        }catch(e){ console.error('PNG 导出失败:',e); alert('PNG 导出失败: '+e.message); }
      };
      img.onerror=function(){
        URL.revokeObjectURL(url);
        alert('SVG 加载失败，无法转 PNG');
      };
      img.src=url;
    }catch(e){ alert('PNG 导出失败: '+e.message); }
  }

  // 监听 giscus iframe 内部的错误消息（giscus 加载成功但仓库未安装 app 时会通过 postMessage 报错）
  window.addEventListener('message', function(ev){
    if(ev && ev.origin && ev.origin.indexOf('giscus.app')>=0){
      try{
        var data = ev.data;
        if(data && data.giscus && data.giscus.error){
          var giscusError=String(data.giscus.error||'');
          // A specific mapping has no Discussion until the first visitor posts.
          // giscus reports this bootstrap state as an error even though the
          // iframe and composer are functioning normally.
          if(/discussion not found/i.test(giscusError)) return;
          var host = document.getElementById('giscusHostPage');
          if(host && host.querySelector('iframe.giscus-frame') && !host.getAttribute('data-err-shown')){
            host.setAttribute('data-err-shown','1');
            // 保留 iframe，但在上方插入提示

            note.textContent = '评论区暂不可用：'+(giscusError||'giscus 加载失败');
            host.insertBefore(note, host.firstChild);
          }
        }
      }catch(_){}
    }
  });
